# Local development toolset for this worktree, managed by mise.
# Activate with `mise activate` in the shell, or run tools through
# `mise x -- <command>`.
#
# Notes:
# - The denkhaus-lab branch carries its own .mise.toml for run
#   sandboxes (fabro-runner:mise image). Keep overlapping pins
#   aligned with that file so lab and local hosts behave the same.
# - The Rust toolchain is owned by rustup (pinned nightly-2026-04-14,
#   see AGENTS.md); do not add cargo/rust here.

[tools]
# Task runner for the local build + docker compose pipeline (justfile).
just = "1.58.0"
# Frontend toolchain: `cargo dev docker-build` / `just` recipes refresh
# the embedded SPA via `bun run build` (fabro-dev spa refresh).
bun = "1.4.0"
# Shell for scripts/ helpers: justfile recipes are thin launchers, the
# logic (clean-target, install-cli, wait-healthy) lives in nushell.
# Keep aligned with the lab branch pin.
"aqua:nushell/nushell" = "0.116.1"
# Expertise CLI (git-native, see AGENTS.md); bin: mulch. The native
# Rust CLI (crates.io, repo denkhaus/mulch) replaced the npm
# @os-eco/mulch-cli reference tool 2026-10-31 (work#1070, the
# ADR-0023 self-hosting cutover; format-compatible with 0.10.7).
"cargo:mulch" = "0.1.0"
# The issue tracker CLI `seeds`, pinned LOCALLY via mise's cargo backend
# (crates.io 0.9.0; the denkhaus Rust app replaced the npm
# @os-eco/seeds-cli reference tool 2026-09-26 — no sd bin; the ubi
# backend is deprecated). Needs cargo — the toolchain image and dev
# hosts have it. The repo must not rely on a global install. 0.13.0 is
# the self-referential command strings release (seeds-9667) plus the
# native mulch coupling (seeds-26c3; 0.11.1 was seeds-95a3, the label
# id-word refusal). Keep aligned with
# ARG SEEDS_VERSION in .fabro/Dockerfile.toolchain
# (run sandboxes install the same release binary).
"cargo:seeds" = "0.13.0"
# Git hooks (lefthook.yml: pre-commit leak + guard + nu lint gates,
# pre-push full scan). After cloning: mise install && lefthook install.
# Mirrors fabro-tofu's setup (same pins).
lefthook = "2.1.10"
# Secret scanner riding those hooks (staged diff pre-commit, full repo
# pre-push). NOTE: this catches CREDENTIALS, not internal
# configuration — the host-identity guard in scripts/guards/ covers
# the address/port class (2026-11-09 leak, mulch mx-9c1e77).
betterleaks = "1.7.4"

[settings.npm]
# Default aube backend aborts on its interactive `mise add` approval prompt
# in non-TTY installs; bun -g is the verified path for these script-less CLIs.
package_manager = "bun"
