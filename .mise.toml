# Workspace toolset for the lab branch. Bootstrapped by the [run.prepare]
# step via mise (image: fabro-runner:mise — lean base, no baked-in tools).
#
# Backend notes (mise 2026.8.10):
# - npm-distributed CLIs (seeds/mulch) go through `bun install -g` in the
#   prepare step; mise's npm/aube backend demands interactive confirmation.
#   BUN_INSTALL is pinned to a PATH dir by the runner image for exactly this.
# - nushell and betterleaks come from the aqua registry; lefthook has a
#   native mise backend.
# - lefthook AND betterleaks TEMPORARILY REMOVED: both install through
#   the aqua backend, whose cosign-bundle/artifact-attestation verification
#   fetches the Sigstore TUF repository — that fetch fails from run
#   sandboxes (runs 01M0QDMSDRZQ, 01M0QFC53P6D, 01M0QFX511V5: lefthook
#   2.0.x/2.1.x alike, betterleaks via embedded cosign bundle; plain curl
#   reaches sigstore fine from the same network — mise-side issue).
#   betterleaks is only wired into lefthook's pre-commit (lefthook.yml),
#   so nothing in the run path needs it. Both belong to a complete
#   quality gate: restore when the on-demand image build exists (bake the
#   toolchain, fabro-meta-a7c3).
[tools]
bun = "1.4.0"
"aqua:nushell/nushell" = "0.115.0"
go = "1.27.0"
just = "1.58.0"
