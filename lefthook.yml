# lefthook (the fabro-tofu pattern): the branch-door pre-push gate.
# Activate per clone: `lefthook install` (mise/bunx lefthook). The gate
# script reads git's pushed refs from stdin; push args ride lefthook's
# {push_args} (remote and url), defaulting to origin.
pre-push:
  commands:
    branch-door:
      run: nu scripts/hooks/pre-push {push_args}
