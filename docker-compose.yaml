services:
  fabro:
    # Default `local`: the image `just build-image` produces. The previous
    # default `nightly` silently ignored the fresh build and ran the cached
    # public nightly instead (observed: CLI 0.335 vs server 0.331, run
    # config rejected at the then-unknown [run.pull_request] model key).
    image: ghcr.io/fabro-sh/fabro:${FABRO_VERSION:-local}
    restart: always
    ports:
      - "${FABRO_PORT:-32276}:32276"
    volumes:
      - fabro-storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:32276/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  fabro-storage:
