# Pinned compose project name (fabro-b03f): without it the project — and
# with it the derived storage volume `fabro_fabro-storage` — is named after
# the directory `docker compose` runs from. Bringing the stack up from a
# different clone/worktree path minted a fresh, empty fabro-storage volume
# and the refreshed container booted unconfigured (install mode, /api/v1/*
# 404). Pinning the name makes every invocation path resolve the same
# project, so a routine `just up` image refresh reuses the configured
# storage volume (server config: /storage/.home/settings.toml).
name: fabro

services:
  fabro:
    # Default `local`: the image `just build-image` produces. The previous
    # default `nightly` silently ignored the fresh build and ran the cached
    # public nightly instead (observed: CLI 0.335 vs server 0.331, run
    # config rejected at the then-unknown [run.pull_request] model key).
    image: ghcr.io/fabro-sh/fabro:${FABRO_VERSION:-local}
    restart: always
    ports:
      - "${FABRO_PORT:-32276}:32276"
    volumes:
      - fabro-storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:32276/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  fabro-storage:
