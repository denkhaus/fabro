# ChatGPT OAuth (Codex) access to the OpenAI roster. lithos speaks the Codex
# deployment through the `openai` adapter in codex mode; this provider exists
# so a `fabro provider login --provider openai` device-flow credential routes
# here while an API key keeps routing to `openai`. It is hidden from listings
# and stands in for `openai` when `openai` itself has no credentials.
[providers."openai-codex"]
display_name = "OpenAI (ChatGPT)"
adapter = "openai"
codec = "openai-responses"
base_url = "https://chatgpt.com/backend-api/codex"
priority = 89
allow_passthrough = true
