priority = 100
default_model = "claude-sonnet-5"

[providers."anthropic".metadata.fabro]
api_key_url = "https://console.anthropic.com/settings/keys"
credentials = ["env:ANTHROPIC_API_KEY", "vault:ANTHROPIC_API_KEY"]
enabled = true

