# Fabro's policy layer over the lithos-llm built-in catalog.
#
# Applied after the built-ins and before operator `[llm]` overlays. Everything
# under `metadata.fabro` is Fabro policy that lithos carries verbatim:
#
# - `enabled`: whether Fabro offers the provider or model.
# - `credentials`: ordered credential references (`env:NAME`, `vault:NAME`,
#   `aws_sigv4`); the first that resolves wins.
# - `extra_headers`: request headers, literal or `{{ secrets.NAME }}`.
# - `agent_profile`, `family`, `small_default`, `probe`: agent and selection
#   policy read by the Fabro model resolver.
#
# Modal's default model comes from a deployment template, not this layer.
# GPT-OSS is excluded at user request. This layer cannot restore that family.
schema_version = 1

