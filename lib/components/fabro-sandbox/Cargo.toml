[package]
name = "fabro-sandbox"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "Sandbox trait and implementations for Fabro agent execution environments"

[features]
default = ["local"]
local = []
test-support = []

[lib]
doctest = false

[[bin]]
name = "fabro-sandbox-host"
path = "src/bin/fabro-sandbox-host.rs"

[[bin]]
name = "fabro-sandbox-docker"
path = "src/bin/fabro-sandbox-docker.rs"

[lints]
workspace = true

[dependencies]
sandbox-driver.workspace = true
sandbox-driver-protocol.workspace = true
sandbox-driver-host.workspace = true
sandbox-driver-docker.workspace = true
sandbox-driver-docker-config.workspace = true
sandbox-driver-daytona.workspace = true
sandbox-driver-daytona-config.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
fabro-proc = { path = "../../foundation/fabro-proc" }
fabro-static.workspace = true
fabro-util = { path = "../../foundation/fabro-util" }
fabro-redact.workspace = true

futures = { workspace = true }

fabro-github = { path = "../fabro-github" }
fabro-types = { path = "../../foundation/fabro-types" }

chrono = { workspace = true }

[dev-dependencies]
fabro-github = { path = "../fabro-github", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
serde_json.workspace = true
toml.workspace = true
fabro-test.workspace = true
