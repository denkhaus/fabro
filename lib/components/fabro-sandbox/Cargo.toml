[package]
name = "fabro-sandbox"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "Fabro run sandboxes over the sandbox driver: local, Docker, and Daytona"

[features]
default = ["local"]
local = []
test-support = ["dep:sandbox-driver-testing"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
sandbox-driver.workspace = true
sandbox-driver-protocol.workspace = true
sandbox-driver-host.workspace = true
sandbox-driver-docker.workspace = true
sandbox-driver-docker-config.workspace = true
sandbox-driver-daytona.workspace = true
sandbox-driver-testing = { workspace = true, optional = true }
pebble-coding-agent.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
fabro-static.workspace = true
fabro-util = { path = "../../foundation/fabro-util" }
fabro-redact.workspace = true

futures = { workspace = true }

fabro-github = { path = "../fabro-github" }
fabro-types = { path = "../../foundation/fabro-types" }

[dev-dependencies]
chrono = { workspace = true }
fabro-github = { path = "../fabro-github", features = ["test-support"] }
pebble-coding-agent = { workspace = true, features = ["test-util"] }
sandbox-driver-testing.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
tempfile = "3"
serde_json.workspace = true
toml.workspace = true
fabro-test.workspace = true
