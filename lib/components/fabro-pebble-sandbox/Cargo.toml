[package]
name = "fabro-pebble-sandbox"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "A sandbox-driver handle as the Environment pebble's coding agent runs in"

[features]
test-support = ["dep:sandbox-driver-testing"]

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
sandbox-driver.workspace = true
sandbox-driver-testing = { workspace = true, optional = true }
pebble-coding-agent.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
tracing.workspace = true
fabro-redact.workspace = true
fabro-util = { path = "../../foundation/fabro-util" }
fabro-types = { path = "../../foundation/fabro-types" }

[dev-dependencies]
pebble-coding-agent = { workspace = true, features = ["test-util"] }
sandbox-driver-host.workspace = true
sandbox-driver-testing.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }
