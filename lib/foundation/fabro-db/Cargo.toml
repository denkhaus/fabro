[package]
name = "fabro-db"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true
description = "SQLite storage foundation for Fabro"

[lib]
doctest = false

[lints]
workspace = true

[features]
# In-memory fixture pools carrying the full production migration set, for
# other crates' test suites (dual-listed dev-dependencies only).
test-support = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
sqlx.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
