[providers.zai]
display_name = "Z.ai"
adapter = "openai_compatible"
api_key_url = "https://open.bigmodel.cn/usercenter/apikeys"
base_url = "https://api.z.ai/api/coding/paas/v4"
priority = 60

[providers.zai.auth]
credentials = ["env:ZAI_API_KEY", "vault:ZAI_API_KEY"]

[providers.zai.models."glm-5.3"]
display_name = "GLM 5.3"
family = "glm-5"
default = true
aliases = ["glm", "glm5", "glm53", "glm5.3"]

[providers.zai.models."glm-5.3".limits]
context_window = 1048576
max_output = 131072

[providers.zai.models."glm-5.3".features]
tools = true
vision = false
# GLM-5.3 always reasons; disabling is not supported by the model.
reasoning = true
reasoning_effort = "levels"
prompt_cache = true

[providers.zai.models."glm-5.3".controls]
reasoning_effort = ["low", "high", "max"]

[providers.zai.models."glm-5.3".costs]
input_cost_per_mtok = 1.4
output_cost_per_mtok = 4.4
cache_input_cost_per_mtok = 0.26

[providers.zai.models."glm-5.2"]
display_name = "GLM 5.2"
family = "glm-5"
aliases = ["glm52", "glm5.2"]

[providers.zai.models."glm-5.2".limits]
context_window = 1048576
max_output = 131072

[providers.zai.models."glm-5.2".features]
tools = true
vision = false
reasoning = true
reasoning_effort = "levels"
prompt_cache = true

[providers.zai.models."glm-5.2".controls]
reasoning_effort = ["high", "max"]

[providers.zai.models."glm-5.2".costs]
input_cost_per_mtok = 1.4
output_cost_per_mtok = 4.4
cache_input_cost_per_mtok = 0.26

[providers.zai.models."glm-4.7"]
display_name = "GLM 4.7"
family = "glm-4"
estimated_output_tps = 100
aliases = ["glm4"]

[providers.zai.models."glm-4.7".limits]
context_window = 202752
max_output = 16384

[providers.zai.models."glm-4.7".features]
tools = true
vision = false
# Probe 2026-09-03 (fabro-cd27, api.z.ai/api/coding/paas/v4): glm-4.7
# ALWAYS reasons on the coding endpoint — enable_thinking=false is
# rejected with code 1210 naming low/high/max, and reasoning_effort=low
# yields zero visible reasoning at 5x speed. The old reasoning=false
# label starved the PR-content call of an effort pin, running it in
# full-reasoning mode (71s, occasional non-JSON output).
reasoning = true
reasoning_effort = "levels"

[providers.zai.models."glm-4.7".controls]
reasoning_effort = ["low", "high", "max"]

[providers.zai.models."glm-4.7".costs]
input_cost_per_mtok = 0.6
output_cost_per_mtok = 2.2
