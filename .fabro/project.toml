_version = 1

[run.pull_request]
enabled = true
draft = false

[run.environment]
id = "fabro-dev"

[environments.fabro-dev]
provider = "daytona"

[environments.fabro-dev.image]
dockerfile = { path = "Dockerfile" }

[environments.fabro-dev.resources]
cpu = 8
memory = "16GB"
disk = "20GB"

[environments.fabro-dev.lifecycle]
auto_stop = "30m"

[environments.fabro-dev.labels]
repo = "fabro-sh/fabro"

# Stage journal (denkhaus/work#1060): one durable JSON line per stage
# execution, engine provenance, checkpointed with the run. Non-blocking;
# failures must never affect the run. ONE project-level entry replaces
# the six former per-workflow copies (architect, conductor, develop,
# loop, merge-upstream, revisor): the engine layers merge settings under
# project under workflow, and the `id` makes any higher-layer re-add
# REPLACE this entry instead of appending a duplicate (combine_hooks
# replaces by id, appends id-less entries).
[[run.hooks]]
id = "stage-journal"
name = "stage-journal"
event = "stage_complete"
script = "nu .fabro/scripts/stage-journal.nu"
blocking = false
timeout = "10s"
sandbox = true

