_version = 1

# PR creation requires GitHub write access (run_branch push); disabled for
# local feature testing.
[run.pull_request]
enabled = false

# Default model for all project runs.
[run.model]
provider = "zai"
name = "glm-5.3"

# [run.scm] is intentionally NOT pinned: origin detection resolves
# url.<replacement>.insteadOf rewrites to the canonical URL
# (fabro-manifest detect_manifest_repo_info + fabro_github::canonicalize_repo_origin_url),
# so alias-host checkouts no longer leak their SSH alias into run manifests.

# Toolchain env as project default: agents on this repo need rust/bun AND the
# repo agent tooling (sd/ml for AGENTS.md session primes, pytest for test
# workflows). Stock buildpack-deps:noble lacks all of these.
[run.environment]
id = "toolchain"

# Local feature testing: keep checkpoint/metadata branches local-only.
# The sandbox still creates checkpoint commits; remote pushes are skipped so
# runs do not depend on GitHub write access for the origin repo.
[run.run_branch]
push = true

[run.meta_branch]
push = true

# Toolchain image for lint/test smoke runs on this repo. Build locally:
#   docker build -t fabro-toolchain:noble .fabro/Dockerfile.toolchain
# (see docs/internal/self-host-resource-planning.md for resource notes)
[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
docker = "fabro-toolchain:noble"

[environments.toolchain.resources]
cpu = 8
memory = "16GB"

[environments.toolchain.network]
mode = "allow_all"

[environments.toolchain.lifecycle]
stop_on_terminal = true

[environments.fabro-dev]
provider = "daytona"

[environments.fabro-dev.image]
dockerfile = { path = "Dockerfile" }

[environments.fabro-dev.resources]
cpu = 8
memory = "16GB"
disk = "20GB"

[environments.fabro-dev.lifecycle]
auto_stop = "30m"

[environments.fabro-dev.labels]
repo = "fabro-sh/fabro"

