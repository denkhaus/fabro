_version = 1

# Lab branch: workflows only, no repo code, no AGENTS.md — clean conditions
# for exercising the run -> push -> pull dev cycle.
#
# Run behavior (model, prepare, branch pushes, pull requests, integrations,
# notifications) lives in each workflow's own workflow.toml since upstream
# v0.345 (fabro-03ef): `fabro run`/`fabro create` build runs from immutable
# workflow intents and no longer transmit project-level [run]/[environments]
# settings — keeping them here only produces the untransmitted-settings
# warning. Placement is server-managed: environment `mise`
# (image fabro-runner:mise, 8 CPU/16 GB). The image source stays
# .fabro/Dockerfile.mise; image updates go through the server environment
# (dockerfile inline), not this file.
