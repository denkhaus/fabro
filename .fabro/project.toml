_version = 1

# Platform meta branch: workflows, scripts, platform seeds, and the
# painpoint mailbox. Product code lives on the product branch (ADR-0001).

# Lean mise-based environment: ubuntu:24.04 + mise only (no baked-in toolchain).
[run.environment]
id = "mise"

[environments.mise]
provider = "docker"

[environments.mise.image]
docker = "fabro-runner:mise"

[environments.mise.resources]
cpu = 8
memory = "16GB"

[environments.mise.network]
mode = "allow_all"

[environments.mise.lifecycle]
stop_on_terminal = true

# Bootstrap workspace tooling BEFORE any stage runs: mise reads .mise.toml,
# bun -g installs the npm CLIs into BUN_INSTALL (already on the image PATH).
[run.prepare]
timeout = "5m"

[[run.prepare.steps]]
script = "mise install"

# Tooling beyond mise (npm CLIs via bun, toolchain checks) lives in
# scripts/bootstrap.nu — no inline shell in config files.
[[run.prepare.steps]]
script = "just bootstrap"

# Default model for all project runs.
[run.model]
provider = "zai"
name = "glm-5.3"

# Dev-cycle test: push checkpoint branches to the fork.
[run.run_branch]
push = true

[run.meta_branch]
push = true

# Autonomous merge-back for platform runs (same as product world): run
# -> PR against the base branch -> auto-merge on green checks.
[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
# glm-4.7: non-reasoning (catalog features.reasoning = false) — cheap,
# clean JSON for PR titling; no reasoning_effort needed ("off" is not a
# valid value: the enum is low|medium|high|xhigh|max). Unset would fall
# back to the run model (glm-5.3), whose reasoning output breaks the
# structured PR call (run 01M0QTNF6GW).
model = "zai:glm-4.7"

[run.integrations.github.permissions]
contents = "write"
pull_requests = "write"

# Terminal-failure visibility (run 01M0T9B7T6 review, rec 5): the 403
# publish failure was silent (notifications: {}). One Slack route for
# terminal lifecycle events is enough to notice credential rot.
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#fabro-reviews"
