_version = 1

[workflow]
graph = "workflow.fabro"

# The line's toolchain environment, repo-declared (ADR-0042): the engine
# builds this image at run initialization FROM THE REPOSITORY (the
# checkout is the build context; the fabro CLI is cooked inside from the
# same sha) — no version pin, no registry, no parity to the deployed
# server (the run channel's compatibility floor guards the seam). A
# server-catalog entry of the same id is overridden layer by layer: the
# build declaration wins over a finished image.
[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
dockerfile = { path = "../../.fabro/Dockerfile.toolchain" }

# adjudicator (ADR-0039 stage D part 2, denkhaus/work#1107): the
# content-verdict gear. One pass = one run: the fast path sweeps the
# merge queue (terminal develop runs without a settled verdict), marks
# the trivial mass LLM-free, and the agent pass judges the rest —
# verdicts, follow-up filings, parks on true policy forks. Fired
# manually for now; the scheduler tick (the three-gear model, stage F)
# drives it later. The workflow directory name is a CONTRACT: the mark
# door's allowlist keys on the workflow slug `adjudicator`.
[run.agent]
# The run-level switch for node-level x.fabro_tools grants (the flip
# precedent): inert without it.
fabro_tools = true

[run.model]
provider = "zai"
name = "glm-5.3"

# The adjudicator's WRITES are door-only (no repo edits, no PR, no
# merge — every write goes through the platform doors over the run
# channel). The automation carrier requires a Git target, and Git
# targets require a clone-enabled run (target_environment_unsupported
# otherwise — caught by the first supervised tick, 2026-11-06): the run
# carries a depth-1 shallow checkout it never writes to. A bare
# sandbox with the channel mount remains the whole workspace NEED.
[run.clone]
depth = 1

# No [run.integrations.github.permissions] (ADR-0019): agent shells get
# NO forge token; every tracker interaction is engine-mediated through
# the work tools.

# The terminal notification is the operator's park signal: the pass
# output names the parked forks, the run title carries the pass verdict.
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#dev-fabro"
