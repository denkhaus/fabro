_version = 1

[workflow]
graph = "workflow.fabro"

# Terminal cleanup (work#1478): the server sweeps the run's build
# artifacts in-sandbox when the run turns terminal, before the container
# is released. The merger's per-merge cargo smokes leave multi-GB target
# trees that would otherwise cost their whole retention window.
# Whitelist and mechanics: the script header (.fabro/scripts/run-cleanup.nu).
terminal_cleanup = "nu .fabro/scripts/run-cleanup.nu"

# The line's toolchain environment, repo-declared (ADR-0042): the engine
# builds this image at run initialization FROM THE REPOSITORY (the
# checkout is the build context; the fabro CLI is cooked inside from the
# same sha) — no version pin, no registry, no parity to the deployed
# server (the run channel's compatibility floor guards the seam). A
# server-catalog entry of the same id is overridden layer by layer: the
# build declaration wins over a finished image.
[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
dockerfile = { path = "../../Dockerfile.toolchain" }

# merger (ADR-0039 stage E, denkhaus/work#1107): the technical-
# integration gear. One pass = one run: the fast path reads the closable
# queue (runs the adjudicator marked merge:enabled), merges the clean
# mass through the merge door (LLM-free), smokes each integrated tree,
# and marks the verdict; the agent pass resolves real conflicts the
# merge door reports. Fired manually for now; the scheduler tick (the
# three-gear model, stage F) drives it later. What this workflow's runs
# may do at the engine's doors is DECLARED below in [run.grants]
# (ADR-0052): the engine knows no workflow by name.
[run.agent]
# The run-level switch for node-level x.fabro_tools grants (the flip
# precedent): inert without it.
fabro_tools = true

# The engine doors this workflow's runs may use (ADR-0052): it writes the
# `closable` verdict, merges through the merge door, and pushes conflict
# resolutions through the resolve push door. The project's grant lint
# (scripts/lint-workflow-grants.nu) holds the allow-list of this block.
[run.grants]
verdict_fields = ["closable"]
merge = true
resolve_push = true

[run.model]
provider = "zai"
name = "glm-5.3"

# The merger DOES clone: the cheap integration smoke (cargo check on
# the merged tree) needs the workspace, and the agent pass resolves
# conflicts in a real checkout. The merge itself NEVER happens here —
# the door merges server-side with the server's credentials; the
# checkout is read-only integration evidence.
[run.clone]
depth = 0

# No [run.integrations.github.permissions] (ADR-0019): agent shells get
# NO forge token. The merge door is engine-mediated, and a conflict
# resolution pushes through the resolve push door (ADR-0047): the
# server transfers the commit's objects from this run's checkout and
# pushes the target's run branch with its own credentials — the
# sandbox never holds a forge credential.

# The run branch is the conflict-resolution vehicle ONLY: a resolution
# commit lands on the run's branch (never on the line branch — the
# merge door is the only line writer). No pull request: the merger
# produces verdicts and merged trees, its own run is not content.
[run.run_branch]
push = true

# The terminal notification is the operator's park signal: the pass
# output names the conflict parks, the run title carries the pass
# verdict.
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#dev-fabro"
