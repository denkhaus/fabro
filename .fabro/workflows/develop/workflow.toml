_version = 1

[workflow]
graph = "workflow.fabro"

# Stage journal (seed fabro-176b): one durable JSON per stage execution,
# engine provenance, checkpointed with the run. Non-blocking; failures
# must never affect the run (side-effect only).
[[run.hooks]]
name = "stage-journal"
event = "stage_complete"
script = "nu .fabro/workflows/develop/scripts/stage-journal.nu"
blocking = false
timeout = "10s"
sandbox = true

# ── Runtime contract (fabro-03ef) ──────────────────────────────────────
# Since upstream v0.345, `fabro run`/`fabro create` build runs from
# immutable workflow intents and no longer transmit project-level
# [run]/[environments] settings: workflow behavior lives HERE, placement
# is server-managed. Starts go through `just run develop` which passes
# --environment mise (the intent's environment override outranks any pin
# here, and a local `fabro preflight` cannot resolve server-managed
# environment ids — placement is therefore NOT pinned in this file; the
# wrapper flag is the single source).
#
# Default model (moved from project.toml).
[run.model]
provider = "zai"
name = "glm-5.3"

# NO prepare steps: the toolchain environment bakes
# everything (rust nightly pin, clippy/rustfmt, nextest, just, nu, rg, bun,
# sd/ml, pytest — .fabro/Dockerfile.toolchain). Runs start instantly; a
# prepare no-op check would only burn tester time.

# Dev-cycle: push checkpoint/metadata branches to the fork (local feature
# testing keeps them pushable so the PR cycle can engage).
[run.run_branch]
push = true

[run.meta_branch]
push = true

# Merge-back (run -> PR -> base branch): every successful run with a
# non-empty diff opens a PR against the base branch. Auto-merge is OFF:
# the enablePullRequestAutoMerge GraphQL call deterministically fails on
# this repository ("Auto merge is not allowed for this repository",
# fabro-6a5a) and only burned ~1 round-trip + a recurring warn per run.
# Double-pick risk (a scheduled run re-implementing a seed that already
# has a landed/landing PR — observed: three parallel -pretty
# implementations on orphaned run branches) is now covered by the
# planner-side in-flight PR/run check (fabro-06e0/fabro-91ff), which
# skips seeds whose run already has an open PR or in-flight run before
# the implementer is ever dispatched. PRs land via manual/scheduled
# merge-back instead of GitHub auto-merge.
[run.pull_request]
enabled = true
draft = false
auto_merge = false
merge_strategy = "squash"
# glm-4.7: non-reasoning (catalog features.reasoning = false) — cheap,
# clean JSON for PR titling; no reasoning_effort needed (and "off" is not
# a valid value: the enum is low|medium|high|xhigh|max).
model = "zai:glm-4.7"

# NO [run.integrations.github.permissions] (ADR-0019, user directive 2026-09-08):
# the legacy write token is vestigial - the ENGINE performs all forge
# operations (branch push, PR create, auto-merge, waits) with its own
# credentials; agent shells get NO GITHUB_TOKEN (empty permissions =
# no_token path in initialize.rs). Forge reads go through engine-mediated
# tools (fabro_runs_list), never raw clients.

# Terminal-failure visibility (run 01M0T9B7T review, rec 5): one Slack
# route for terminal lifecycle events is enough to notice credential rot.
# Channel: #dev-fabro exists (fabro-1ddb phase 1, 2026-08-27).
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#dev-fabro"
