_version = 1

[workflow]
graph = "workflow.fabro"

# The line's toolchain environment, repo-declared (ADR-0042): the engine
# builds this image at run initialization FROM THE REPOSITORY (the
# checkout is the build context; the fabro CLI is cooked inside from the
# same sha) — no version pin, no registry, no parity to the deployed
# server (the run channel's compatibility floor guards the seam). A
# server-catalog entry of the same id is overridden layer by layer: the
# build declaration wins over a finished image.
[environments.toolchain]
provider = "docker"

[environments.toolchain.image]
dockerfile = { path = "../../Dockerfile.toolchain" }

# watchdog (ADR-0039 stage F, denkhaus/work#1107; grilled 2026-11-05):
# the dead-man watch over the scheduler gears. One pass = one LLM-free
# command stage: every ENABLED gear automation must have completed a
# pass within 3x its tick interval (adjudicator */15 -> 45m, merger and
# develop -> 90m); a stall exits non-zero and the red run rides the
# Slack lifecycle notification to the operator. A disabled gear stays
# silent — the user's pause is authoritative. Fired hourly by its own
# automation (0 * * * *, created at the fork.30 cutover); nothing
# watches the watchdog — its automation row and `fabro ps -a --workflow
# watchdog` carry meta-stall visibility (grilled: list visibility).
# Read doors only: `fabro automations list` + `fabro ps` over the run
# channel; no agent stage, no model, no writes.
