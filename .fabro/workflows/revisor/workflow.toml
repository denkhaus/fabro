_version = 1

[workflow]
graph = "workflow.fabro"

# fabro-7461 (ADR-0011): the revisor's agents hold the inspection tool
# catalog. fabro_runs_list (select) and fabro_ask (analyze) additionally
# require the graph's inspects attribute; node-level fabro_tools keeps
# the grant least-privilege per stage.
[run.agent]
fabro_tools = true

# Stage journal (same contract as develop, seed fabro-176b): one durable
# JSON line per stage execution, engine provenance, checkpointed with the
# run. Non-blocking; failures must never affect the run.
[[run.hooks]]
name = "stage-journal"
event = "stage_complete"
script = "nu .fabro/scripts/stage-journal.nu"
blocking = false
timeout = "10s"
sandbox = true

# Judgment-shadow host hook (fabro-8e13, ADR-0022 wave 1; transport
# fabro-091b): sandbox = false keeps OPENROUTER_API_KEY in the server env,
# never in a run sandbox. The script file rides the workflow closure
# through the hook's `files` declaration; the server stages it under
# FABRO_HOOK_ASSETS for the worker (a host-side hook has no workspace cwd
# on the Docker provider). Unset — local CLI runs with the repo as cwd —
# the path falls back to the workspace root. The ONE source of truth is
# .fabro/scripts/judgment-shadow.nu.
[[run.hooks]]
name = "judgment-shadow"
event = "stage_complete"
sandbox = false
files = ["../../scripts/judgment-shadow.nu"]
script = 'nu "${FABRO_HOOK_ASSETS:-.}/.fabro/scripts/judgment-shadow.nu"'
blocking = false
timeout = "15s"

# ── Runtime contract (fabro-03ef) ──────────────────────────────────────
# Since upstream v0.345, `fabro run`/`fabro create` build runs from
# immutable workflow intents and no longer transmit project-level
# [run]/[environments] settings: workflow behavior lives HERE, placement
# is server-managed. A manual start goes through `just run revisor`
# (run_workflow.nu's default `--environment toolchain`) or
# `fabro run revisor --environment toolchain` — the same fire command the
# env_guard node's teaching error names. The intent's environment override
# outranks any pin here, and a local `fabro preflight` cannot resolve
# server-managed environment ids — placement is therefore NOT pinned in
# this file; the wrapper flag is the single source).
#
# Default model (moved from project.toml).
[run.model]
provider = "zai"
name = "glm-5.3"

# NO prepare steps on the merged world: the toolchain environment bakes
# everything (rust nightly pin, clippy/rustfmt, nextest, just, nu, rg, bun,
# seeds/ml, pytest — .fabro/Dockerfile.toolchain). Runs start instantly; a
# prepare no-op check would only burn tester time.

# Full-history clone: the petri engine's checkpoint publishing bundles
# the workspace commit and traverses its whole ancestry; a depth cut
# silently truncates the bundle at the shallow boundary and kills every
# sandbox git-target run at its first checkpoint (fabro-b6c5, fabro-6558;
# mx-9251c9).
[run.clone]
depth = 0

# Dev-cycle: push checkpoint/metadata branches to the fork (local feature
# testing keeps them pushable so the PR cycle can engage).
[run.run_branch]
push = true

[run.meta_branch]
push = true

# Autonomous merge-back (run -> PR -> base branch): every successful run
# with a non-empty diff opens a PR against the base branch; auto-merge
# lands it once required checks pass. Without this, scheduled runs would
# re-implement the same seed every run (observed: three parallel
# -pretty implementations on orphaned run branches).
[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
# glm-4.7: non-reasoning (catalog features.reasoning = false) — cheap,
# clean JSON for PR titling; no reasoning_effort needed (and "off" is not
# a valid value: the enum is low|medium|high|xhigh|max).
model = "zai:glm-4.7"

# NO [run.integrations.github.permissions] (ADR-0019, user directive 2026-09-08):
# the lab-era write token is vestigial - the ENGINE performs all forge
# operations (branch push, PR create, auto-merge, waits) with its own
# credentials; agent shells get NO GITHUB_TOKEN (empty permissions =
# no_token path in initialize.rs). Forge reads go through engine-mediated
# tools (fabro_runs_list), never raw clients.

# Terminal-failure visibility (run 01M0T9B7T review, rec 5): one Slack
# route for terminal lifecycle events is enough to notice credential rot.
# Channel: #dev-fabro exists (provisioned 2026-08-27, phase 1).
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#dev-fabro"
