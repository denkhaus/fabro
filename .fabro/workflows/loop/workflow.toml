_version = 1

[workflow]
graph = "workflow.fabro"

# Stage journal + judgment shadow: the SHARED hooks (stage-journal.nu
# header rule: one copy, referenced from every loop workflow — never
# duplicate per workflow).
[[run.hooks]]
name = "stage-journal"
event = "stage_complete"
script = "nu .fabro/scripts/stage-journal.nu"
blocking = false
timeout = "10s"
sandbox = true

[[run.hooks]]
name = "judgment-shadow"
event = "stage_complete"
script = "nu .fabro/scripts/judgment-shadow.nu"
blocking = false
timeout = "15s"
sandbox = false

# ── Runtime contract ──────────────────────────────────────────────────
# Mirrors develop (fabro-03ef): starts go through `just run loop` which
# passes --environment toolchain (the loop battery needs nu/just/seeds
# and the prebuilt fabro CLI). Placement is server-managed.
#
# No [run.environment] pin here, twice over (fabro-3ab2): (a) the CLI
# always sends an explicit intent environment id and the intent's
# selection outranks the bundle layers, so a pin cannot redirect a
# flag-less manual `fabro run loop` off the default image; (b) a pin
# naming a server-managed id ("toolchain") fails offline validation
# (validate-workflows cannot resolve the server's catalog). The
# fail-closed teaching guard is the graph's FIRST node instead:
# env_guard runs toolchain-guard.sh (POSIX sh) before any nu stage.

[run.model]
provider = "zai"
name = "glm-5.3"

# Canonical run target for MANUAL starts (fabro-70b5 part H: first runs
# manual): this host's origin is an SSH host alias whose normalized URL is
# not github.com, and fabro-manifest does not (yet) apply git's
# url.insteadOf rewrites — run.scm pins the canonical repository so the
# caller checkout derives a valid GitHub run target. Server-side
# automation starts are unaffected (they carry their own target).
[run.scm]
provider = "github"
owner = "denkhaus"
repository = "fabro"

# Full-history clone (same basis as develop: checkpoint publishing
# traverses the whole ancestry; a depth cut kills git-target runs).
[run.clone]
depth = 0

[run.run_branch]
push = true

[run.meta_branch]
push = true

# Run -> PR -> denkhaus, auto-merge: same rationale as develop (a loop
# run's asset diff must publish or the next run re-implements it).
[run.pull_request]
enabled = true
draft = false
auto_merge = true
merge_strategy = "squash"
model = "zai:glm-4.7"

# Terminal-failure visibility on the same Slack route.
[run.notifications.terminal]
enabled = true
provider = "slack"
events = ["run.completed", "run.failed"]

[run.notifications.terminal.slack]
channel = "#dev-fabro"
