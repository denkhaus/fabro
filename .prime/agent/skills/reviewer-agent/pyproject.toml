[project]
name = "reviewer-agent"
version = "0.1.0"
description = "Static reviewer for Fabro workflow assets: project-agnosticism, graph correctness, script and prompt gaps."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
reviewer_agent = "reviewer_agent:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer_agent"]
