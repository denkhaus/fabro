name: Engine freeze

# The engine half of fabro-workflow takes bug fixes only; new engine behaviour
# goes to Petri. A pull request that adds lines under the frozen paths fails
# here unless it carries the `bugfix` label. The frozen paths live in
# `scripts/check-engine-freeze.sh`, which runs locally the same way.
# Labeling re-runs the check so a label added after a failure clears it.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "lib/components/fabro-workflow/src/**"
      - "scripts/check-engine-freeze.sh"
      - "scripts/check-engine-freeze-test.sh"
      - ".github/workflows/engine-freeze.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  freeze:
    name: Engine half takes bug fixes only
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The check diffs against the merge base with the base branch.
          fetch-depth: 0
      - name: Self-test the check
        run: scripts/check-engine-freeze-test.sh
      - name: Check the frozen paths
        env:
          BASE_REF: ${{ github.base_ref }}
          HAS_BUGFIX_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'bugfix') }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if scripts/check-engine-freeze.sh "origin/$BASE_REF"; then
            exit 0
          fi
          if [ "$HAS_BUGFIX_LABEL" = "true" ]; then
            echo "The 'bugfix' label waives the engine freeze for this pull request."
            exit 0
          fi
          echo "::error::This pull request adds lines to the frozen engine half of fabro-workflow (see the log for the paths). New engine behaviour goes to Petri (lib/components/fabro-petri). A bug fix needs the 'bugfix' label."
          exit 1
