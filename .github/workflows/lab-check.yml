# Lightweight check for the lab world branch.
#
# Purpose: a REQUIRED status check on denkhaus-lab so GitHub auto-merge
# can engage on PRs targeting it (fabro-ab2c). Deliberately cheap —
# the full Rust/TypeScript suites are main-only; the lab branch carries
# the product world (gofib), not the platform. Validates the workflow
# assets' shape and the seed tracker's JSONL integrity.
name: Lab check

on:
  pull_request:
    branches: [denkhaus-lab]
  push:
    branches: [denkhaus-lab]

permissions:
  contents: read

jobs:
  check:
    name: lab-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate seed tracker JSONL
        run: |
          python3 - <<'EOF'
          import json, sys
          path = ".seeds/issues.jsonl"
          with open(path) as fh:
              lines = [ln for ln in fh.read().splitlines() if ln.strip()]
          for ln in lines:
              json.loads(ln)
          print(f"seeds: {len(lines)} valid JSONL entries")
          EOF

      - name: Workflow assets present
        run: |
          test -f .fabro/workflows/develop/workflow.fabro
          test -f .fabro/workflows/develop/workflow.toml
          test -f .fabro/workflows/develop/prompts/planner.md
          echo "workflow assets: ok"
