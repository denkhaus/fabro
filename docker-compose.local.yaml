# Pinned compose project name — see docker-compose.yaml (fabro-b03f):
# keeps the `fabro-storage` volume identity stable across invocation
# directories so a stack refresh reuses the configured storage.
name: fabro

services:
  fabro:
    image: fabro-sh/fabro
    restart: unless-stopped
    ports:
      - "32276:32276"
    volumes:
      - fabro-storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  fabro-storage:
